:root{
  /* ---- colour -------------------------------------------------------
     OKLCH throughout. No pure white, no pure black: every neutral carries
     a trace of the cobalt hue (chroma .002–.02), so the greys read as
     chosen rather than inherited.

     The canvas is the LIGHTEST surface and the chrome is tinted, which is
     the inverse of the usual arrangement. Do not "clean up" --surface to
     white: the panels would dissolve into the canvas and the floating
     architecture goes with them. */
  --hue: 267;

  --paper:      oklch(0.994 0.002 var(--hue));   /* canvas ground        */
  --paper-deep: oklch(0.922 0.007 var(--hue));   /* tracks, dots, pressed*/
  --surface:    oklch(0.966 0.004 var(--hue));   /* floating chrome      */
  --surface-2:  oklch(0.994 0.002 var(--hue));   /* insets inside chrome */

  --ink:        oklch(0.205 0.016 var(--hue));
  --ink-2:      oklch(0.445 0.019 var(--hue));
  --ink-3:      oklch(0.625 0.017 var(--hue));
  --ink-4:      oklch(0.765 0.013 var(--hue));

  --line:       oklch(0.205 0.016 var(--hue) / .11);
  --line-2:     oklch(0.205 0.016 var(--hue) / .06);
  --line-3:     oklch(0.205 0.016 var(--hue) / .19);

  --accent:     oklch(0.470 0.238 var(--hue));
  --accent-2:   oklch(0.398 0.222 var(--hue));
  --accent-8:   oklch(0.470 0.238 var(--hue) / .08);
  --accent-12:  oklch(0.470 0.238 var(--hue) / .12);
  --accent-24:  oklch(0.470 0.238 var(--hue) / .24);
  --accent-40:  oklch(0.470 0.238 var(--hue) / .40);

  /* The DESIGNS are a different product with a different palette. Keeping
     the content accent off the chrome accent means "the tool highlighted
     this branch" can never be misread as "this design recommends Plus". */
  --ui-bg:      oklch(0.202 0.017 265);
  --ui-card:    oklch(0.263 0.020 265);
  --ui-card-2:  oklch(0.312 0.021 265);
  --ui-line:    oklch(0.99 0 0 / .09);
  --ui-text:    oklch(0.960 0.003 265);
  --ui-text-2:  oklch(0.690 0.017 258);
  --ui-text-3:  oklch(0.545 0.015 258);
  --ui-mint:    oklch(0.822 0.166 158);
  --ui-mint-dk: oklch(0.262 0.056 158);

  /* ---- type ---------------------------------------------------------
     Two ramps. The chrome ramp runs 9 / 11 / 13 / 17 / 22 with ≥1.18
     between utility steps and ≥1.29 where hierarchy actually turns. The
     design ramp is a separate system because those frames are miniatures
     of a phone screen, not part of this UI. Nine sizes total, down from
     twenty-one. */
  --t-micro: 9px;    /* tracked uppercase labels          */
  --t-meta:  11px;   /* frame names, status, tallies      */
  --t-body:  13px;   /* everything readable               */
  --t-lead:  17px;   /* wordmark, panel heads, copy lines */
  --t-title: 22px;   /* the reasoning subject             */

  --d-micro: 6px;
  --d-meta:  7.5px;
  --d-body:  9.5px;
  --d-head:  15px;

  --w-body:  400;
  --w-mid:   500;
  --w-strong:600;

  /* ---- motion -------------------------------------------------------
     Exponential ease-out only. No bounce, no elastic, no ease-in-out. */
  --e-expo:  cubic-bezier(.16, 1, .3, 1);
  --e-quint: cubic-bezier(.22, 1, .36, 1);
  --e-quart: cubic-bezier(.25, 1, .5, 1);

  --r-xs:3px; --r-sm:6px; --r:9px; --r-lg:14px;

  --shadow-1:0 1px 2px oklch(0.205 0.016 var(--hue) / .06);
  --shadow-2:0 1px 2px oklch(0.205 0.016 var(--hue) / .05),
             0 10px 26px -14px oklch(0.205 0.016 var(--hue) / .30);
  --shadow-3:0 2px 5px oklch(0.205 0.016 var(--hue) / .06),
             0 24px 50px -20px oklch(0.205 0.016 var(--hue) / .34);
  --shadow-frame:0 2px 4px oklch(0.202 0.017 265 / .13),
                 0 16px 36px -16px oklch(0.202 0.017 265 / .44);

  --float-r:14px;
  --float-gap:13px;
  --bar-h:54px;
  --rail-w:42px;
  --panel-l-w:300px;
  --panel-r-w:322px;
}

*,*::before,*::after{ box-sizing:border-box; }

html,body{
  margin:0; padding:0; height:100%;
  background:var(--paper);
  color:var(--ink);
  font-family:'Outfit', ui-sans-serif, -apple-system, "Segoe UI", Roboto, system-ui, sans-serif;
  font-size:var(--t-body);
  font-weight:var(--w-body);
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
}

button,input,textarea{ font:inherit; color:inherit; }
button{ background:none; border:0; margin:0; padding:0; cursor:pointer; }
:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; border-radius:var(--r-xs); }

/* the utility voice: tracking and weight carry it, not a second typeface.
   Deliberately lighter than --ink-3 so it recedes further behind the
   field values it labels — label and answer should never compete. */
.label{
  font-size:var(--t-micro);
  font-weight:var(--w-mid);
  letter-spacing:.11em;
  text-transform:uppercase;
  color:var(--ink-4);
}

/* ============================================================
   SHELL
   ============================================================ */

.app{ position:relative; height:100dvh; overflow:hidden; background:var(--paper); }

.bar{
  position:absolute; top:0; left:0; right:0;
  height:var(--bar-h);
  display:flex; align-items:center;
  padding:0 var(--float-gap);
  z-index:40;
  pointer-events:none;
}
.bar > *{ pointer-events:auto; }
/* frames passing under the bar dissolve instead of colliding with it */
.bar::before{
  content:""; position:absolute; inset:-1px 0 0;
  background:linear-gradient(var(--paper) 42%, oklch(0.994 0.002 267 / 0));
  z-index:-1;
}

.brand{ display:flex; align-items:center; gap:11px; flex:none; }

.mark{
  font-size:var(--t-lead);
  font-weight:var(--mark-name, 400);
  line-height:1;
  letter-spacing:-.005em;
  color:var(--ink);
  white-space:nowrap;
}
.mark-frame{ font-weight:var(--mark-frame, 700); }
/* Outfit's "<" is a math glyph centred on the math axis, not the x-height a
   "v" sits in. Nudge here if it rides high. */
.mark-branch{ display:inline-block; transform:translateY(var(--mark-branch-y, 0em)); }

.file{
  font-size:var(--t-meta); color:var(--ink-3);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  padding-left:11px; border-left:1px solid var(--line-3);
}
.file b{ font-weight:var(--w-mid); color:var(--ink-2); }

.steppill{
  position:absolute; left:50%; transform:translateX(-50%);
  display:flex; align-items:center; gap:11px;
  min-height:34px; padding:8px 16px;
  border-radius:20px;
  background:var(--surface);
  border:1px solid var(--line);
  box-shadow:var(--shadow-2);
}
.ticks{ display:flex; gap:3px; flex:none; }
.tick{ width:12px; height:3px; border-radius:2px; background:var(--paper-deep); transition:background .35s var(--e-quart); }
.tick.done{ background:var(--accent-40); }
.tick.now{ background:var(--accent); }
.steplabel{
  font-size:var(--t-meta); letter-spacing:.02em;
  color:var(--ink-3); white-space:nowrap; flex:none;
  font-variant-numeric:tabular-nums;
}
.steplabel b{ color:var(--ink); font-weight:var(--w-mid); }

/* The one place coaching guidance lives now — next to the step it
   belongs to, instead of a tip bubble floating next to whatever's live.
   The live element still gets its own .coach glow; this just says what
   it does and what happens next. */
.stepdivider{ width:1px; align-self:stretch; background:var(--line-2); flex:none; }
.stepguide{ font-size:var(--t-meta); color:var(--ink-2); line-height:1.4; max-width:340px; }

.baractions{ margin-left:auto; display:flex; align-items:center; gap:8px; flex:none; }

.btn{
  position:relative;
  display:inline-flex; align-items:center; gap:7px;
  height:32px; padding:0 13px;
  border-radius:var(--r-sm);
  font-size:var(--t-body); font-weight:var(--w-mid); letter-spacing:-.003em;
  border:1px solid var(--line);
  background:var(--surface);
  color:var(--ink-2);
  box-shadow:var(--shadow-1);
  transition:background .2s var(--e-quart), border-color .2s var(--e-quart),
             color .2s var(--e-quart), transform .2s var(--e-quart);
}
.btn:hover{ background:var(--surface-2); border-color:var(--line-3); color:var(--ink); }
.btn:active{ transform:scale(.985); }
.btn-primary{
  background:var(--accent); border-color:var(--accent); color:var(--surface-2);
  font-weight:var(--w-mid); box-shadow:var(--shadow-2);
}
.btn-primary:hover{ background:var(--accent-2); border-color:var(--accent-2); color:var(--surface-2); }
.btn[hidden]{ display:none; }

/* ============================================================
   FLOATING PANELS
   ============================================================ */

.panel{
  position:absolute;
  top:calc(var(--bar-h) + var(--float-gap));
  bottom:var(--float-gap);
  border-radius:var(--float-r);
  background:var(--surface);
  border:1px solid var(--line);
  box-shadow:var(--shadow-2);
  overflow-y:auto;
  overscroll-behavior:contain;
  z-index:30;
  transition:opacity .34s var(--e-quint), transform .34s var(--e-quint);
}
.panel-l{ left:var(--float-gap); width:var(--panel-l-w); }
.panel-r{ right:calc(var(--float-gap) + var(--rail-w) + 7px); width:var(--panel-r-w); }

.app.focusmode .panel-l{ opacity:0; transform:translateX(-16px); pointer-events:none; }
.app.focusmode .panel-r{ opacity:0; transform:translateX(16px); pointer-events:none; }

/* Reasoning has nothing to reason about until something is selected.
   Hide it rather than show a placeholder, and hand the width back to
   the canvas (see fitRegion). Click the blank canvas to get here. */
.panel-r.collapsed{ opacity:0; transform:translateX(16px); pointer-events:none; }

.panel-head{
  position:sticky; top:0; z-index:5;
  display:flex; align-items:center; gap:8px;
  padding:16px 18px 12px;
  background:var(--surface);
  border-bottom:1px solid var(--line-2);
  border-radius:var(--float-r) var(--float-r) 0 0;
}
.panel-head h2{ margin:0; font-size:var(--t-body); font-weight:var(--w-strong); letter-spacing:-.012em; }
.panel-head .state{ margin-left:auto; }

/* Spacing carries rhythm rather than sitting at one value: fields sit
   close inside a group, groups sit further apart. */
.panel-body{ padding:16px 18px 24px; display:flex; flex-direction:column; gap:22px; }
.group{ display:flex; flex-direction:column; gap:15px; }

.field{ display:flex; flex-direction:column; gap:5px; }
.field-value{ font-size:var(--t-body); line-height:1.5; color:var(--ink); }
.field-value.strong{ font-weight:var(--w-mid); color:var(--ink); letter-spacing:-.008em; }

/* Click any context value to edit it in place — the field it belongs to
   never stops being editable, before or after "Set context". Reset to
   look like plain text at rest; only hints at being a button on hover. */
.field-edit{
  display:block; width:100%; text-align:left; font:inherit;
  background:none; border:1px solid transparent; border-radius:var(--r-xs);
  margin:-3px -5px; padding:2px 5px;
  transition:background .16s var(--e-quart), border-color .16s var(--e-quart);
}
.field-edit:hover{ background:var(--surface-2); border-color:var(--line-2); cursor:text; }

/* A question reads as an invitation to answer, not a category to scan —
   sentence case, no tracking, a touch darker than the micro-labels so it
   still sits above the answer without shouting it in tracked caps. */
.field-q{ font-size:var(--t-meta); font-weight:var(--w-mid); color:var(--ink-3); line-height:1.35; }

.chips{ display:flex; flex-wrap:wrap; gap:5px; }
.chip{
  display:inline-flex; align-items:center; gap:6px;
  height:24px; padding:0 9px;
  border-radius:var(--r-xs);
  border:1px solid var(--line);
  background:var(--surface-2);
  font-size:var(--t-meta); color:var(--ink-2); white-space:nowrap;
}
.chip button{ color:var(--ink-4); display:flex; line-height:0; transition:color .16s var(--e-quart); }
.chip button:hover{ color:var(--ink); }

.chip-add{ border-style:dashed; border-color:var(--line-3); gap:5px; }
.chip-add .ico{ display:flex; color:var(--ink-4); }
.chip-add input{
  border:0; background:none; outline:0; padding:0; width:108px;
  font:inherit; font-size:var(--t-meta); color:var(--ink);
}
.chip-add input::placeholder{ color:var(--ink-4); }

.rule{ height:1px; background:var(--line-2); }

.blank{ display:flex; flex-direction:column; gap:10px; padding:12px 0 4px; color:var(--ink-3); line-height:1.55; }
.blank p{ margin:0; }
.blank .barline{ height:8px; border-radius:3px; background:var(--paper-deep); }
.blank .barline.s{ width:54%; }
.blank .barline.m{ width:84%; }

/* ---------- inline context form ----------
   Not a modal. The context lives in this panel, so it is filled in this
   panel: the values land exactly where they will be read, and there is no
   overlay between the reviewer and the frame they just placed. */

.setup-lede{ display:flex; flex-direction:column; gap:6px; }
.setup-lede h3{ margin:0; font-size:var(--t-lead); font-weight:var(--w-strong); letter-spacing:-.02em; line-height:1.2; text-wrap:balance; }
.setup-lede p{ margin:0; font-size:var(--t-meta); color:var(--ink-3); line-height:1.5; }

.inp{
  width:100%;
  border:1px solid var(--line);
  border-radius:var(--r-sm);
  background:var(--surface-2);
  padding:9px 11px;
  font-size:var(--t-body); line-height:1.45; color:var(--ink);
  resize:none;
  transition:border-color .18s var(--e-quart), box-shadow .18s var(--e-quart);
}
.inp::placeholder{ color:var(--ink-4); }
.inp:focus{ outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-8); }

.seg{ display:flex; gap:2px; padding:3px; border-radius:var(--r-sm); background:var(--paper-deep); }
.seg button{
  flex:1; height:26px; border-radius:var(--r-xs);
  font-size:var(--t-meta); font-weight:var(--w-mid); color:var(--ink-3);
  transition:background .2s var(--e-quart), color .2s var(--e-quart);
}
.seg button:hover{ color:var(--ink); }
.seg button.on{ background:var(--surface-2); color:var(--ink); box-shadow:var(--shadow-1); }

.setup-go{ width:100%; justify-content:center; height:36px; }

/* ---------- reasoning ---------- */

.reason-title{ display:flex; flex-direction:column; gap:8px; padding-bottom:15px; border-bottom:1px solid var(--line-2); }
.reason-title h3{ margin:0; font-size:var(--t-title); font-weight:var(--w-strong); letter-spacing:-.026em; line-height:1.14; text-wrap:balance; }
.reason-title .sub{ font-size:var(--t-body); color:var(--ink-2); line-height:1.45; }

.kind{
  display:inline-flex; align-items:center; gap:6px; align-self:flex-start;
  height:20px; padding:0 8px;
  border-radius:var(--r-xs);
  background:var(--accent-8); color:var(--accent-2);
  font-size:var(--t-micro); font-weight:var(--w-mid);
  letter-spacing:.11em; text-transform:uppercase;
}
.kind::before{ content:""; width:5px; height:5px; border-radius:50%; background:var(--accent); }

.reason-list{ display:flex; flex-direction:column; gap:16px; }
.reason-item{ display:flex; flex-direction:column; gap:4px; }
.reason-item .label{ color:var(--accent-2); opacity:.82; }
.reason-item p{ margin:0; font-size:var(--t-body); line-height:1.6; color:var(--ink-2); }
.reason-item.risk .label{ color:var(--ink-3); opacity:1; }

/* The candidate line, set at reading size. No accent side-stripe: a full
   hairline and a tint do the same separation without the tell. */
.quote-block{
  padding:14px 15px;
  border-radius:var(--r-sm);
  border:1px solid var(--accent-24);
  background:var(--accent-8);
  font-size:var(--t-lead); line-height:1.4; color:var(--ink);
  letter-spacing:-.016em; font-weight:var(--w-body);
}

/* Curate the option itself, independent of the scripted tour. */
.option-actions{ display:flex; gap:8px; padding-bottom:15px; border-bottom:1px solid var(--line-2); }
.obtn{
  flex:1; display:inline-flex; align-items:center; justify-content:center; gap:7px;
  height:32px; padding:0 10px;
  border-radius:var(--r-sm); border:1px solid var(--line);
  background:var(--surface-2); color:var(--ink-2);
  font-size:var(--t-meta); font-weight:var(--w-mid); letter-spacing:-.003em;
  transition:background .18s var(--e-quart), border-color .18s var(--e-quart), color .18s var(--e-quart);
}
.obtn:hover{ background:var(--paper-deep); border-color:var(--line-3); color:var(--ink); }
.obtn:disabled{ opacity:.5; cursor:not-allowed; }
.obtn:disabled:hover{ background:var(--surface-2); border-color:var(--line); color:var(--ink-2); }
.obtn .ico{ display:flex; flex:none; color:var(--ink-3); }
.obtn-reject.on{ background:var(--surface-2); color:var(--ink-3); opacity:1; }

.reject-note{
  display:flex; flex-direction:column; gap:4px; padding-bottom:15px;
  border-bottom:1px solid var(--line-2);
}
.reject-note p{ margin:0; font-size:var(--t-body); color:var(--ink-2); line-height:1.5; font-style:italic; }
.linklike{
  align-self:flex-start; font-size:var(--t-meta); font-weight:var(--w-mid);
  color:var(--accent-2); text-decoration:underline; text-underline-offset:2px;
}
.linklike:hover{ color:var(--accent); }

.reject-form{ display:flex; flex-direction:column; gap:8px; padding-bottom:15px; border-bottom:1px solid var(--line-2); }
.reject-form textarea{
  width:100%; padding:9px 11px; resize:vertical;
  border-radius:var(--r-sm); border:1px solid var(--line);
  background:var(--surface-2); color:var(--ink);
  font:inherit; font-size:var(--t-body); line-height:1.5;
}
.reject-form textarea::placeholder{ color:var(--ink-4); }
.reject-form textarea:focus{ border-color:var(--accent-40); }
.reject-form-row{ display:flex; justify-content:flex-end; gap:8px; }

@keyframes flashring{
  0%{ box-shadow:0 0 0 0 var(--accent-40); }
  40%{ box-shadow:0 0 0 4px var(--accent-24); }
  100%{ box-shadow:0 0 0 0 oklch(0.470 0.238 267 / 0); }
}
.act-list{ display:flex; flex-direction:column; gap:3px; padding:6px; border-radius:var(--r); border:1px solid var(--line-2); background:var(--surface-2); }

.explore-controls{ display:flex; flex-direction:column; gap:8px; }
.explore-count{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
.explore-count span{ font-size:var(--t-meta); color:var(--ink-3); }
.countinput{
  width:52px; height:28px; padding:0 8px;
  border-radius:var(--r-sm); border:1px solid var(--line);
  background:var(--surface-2); color:var(--ink);
  font-size:var(--t-meta); font-weight:var(--w-mid); text-align:center;
  font-variant-numeric:tabular-nums;
}
.countinput:focus{ border-color:var(--accent-40); }
.promptinput{
  width:100%; height:32px; padding:0 11px;
  border-radius:var(--r-sm); border:1px solid var(--line);
  background:var(--surface-2); color:var(--ink);
  font-size:var(--t-body);
}
.promptinput::placeholder{ color:var(--ink-4); }
.promptinput:focus{ border-color:var(--accent-40); }

/* Every explorable node (direction, concept, copy line) can leave the
   canvas on its own, independent of the scripted end-to-end export. */
.reason-export{ display:flex; flex-direction:column; gap:9px; padding-top:2px; border-top:1px solid var(--line-2); }
.export-row{ display:flex; gap:8px; }
.xbtn{
  flex:1; display:inline-flex; align-items:center; justify-content:center; gap:7px;
  height:32px; padding:0 10px;
  border-radius:var(--r-sm);
  border:1px solid var(--line);
  background:var(--surface-2);
  color:var(--ink-2);
  font-size:var(--t-meta); font-weight:var(--w-mid); letter-spacing:-.003em;
  transition:background .18s var(--e-quart), border-color .18s var(--e-quart), color .18s var(--e-quart);
}
.xbtn:hover{ background:var(--paper-deep); border-color:var(--line-3); color:var(--ink); }
.xbtn .ico{ display:flex; flex:none; color:var(--ink-3); }

/* ============================================================
   CANVAS
   ============================================================ */

.canvas{
  position:absolute; inset:0;
  overflow:hidden;
  background-color:var(--paper);
  background-image:radial-gradient(circle, oklch(0.205 0.016 267 / .15) 1px, transparent 1px);
  background-size:24px 24px;
  cursor:default;
}
.canvas.pan{ cursor:grab; }
.canvas.dragging{ cursor:grabbing; }

.layer{ position:absolute; top:0; left:0; width:0; height:0; transform-origin:0 0; will-change:transform; }
.layer.eased{ transition:transform .68s var(--e-expo); }

.wires{ position:absolute; left:-400px; top:-400px; width:2400px; height:1700px; pointer-events:none; overflow:visible; }
.wire{ fill:none; stroke:var(--line-3); stroke-width:1.4; transition:stroke .5s var(--e-quart), stroke-width .5s var(--e-quart), opacity .5s var(--e-quart); }
.wire.lit{ stroke:var(--accent); stroke-width:2; }
.wire.dim{ opacity:.26; }

.node{
  position:absolute; width:280px;
  display:flex; flex-direction:column; gap:6px;
  animation:pop .5s var(--e-expo) both;
}
@keyframes pop{ from{ opacity:0; transform:translateY(9px) scale(.976); } to{ opacity:1; transform:none; } }

.node-head{ display:flex; align-items:center; gap:6px; padding-left:1px; min-height:14px; }
.node-head .ic{ display:flex; color:var(--ink-4); flex:none; }
.node-name{
  font-size:var(--t-meta); font-weight:var(--w-body); letter-spacing:.005em;
  color:var(--ink-2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.node-kind{ font-size:var(--t-micro); font-weight:var(--w-mid); letter-spacing:.11em; text-transform:uppercase; color:var(--ink-4); flex:none; }
.node.sel .node-name{ color:var(--accent-2); font-weight:var(--w-strong); }
.node.sel .node-head .ic{ color:var(--accent); }

.frame{
  position:relative;
  height:200px;
  border-radius:var(--r);
  background:var(--ui-bg);
  box-shadow:var(--shadow-frame);
  overflow:hidden;
  width:100%;
  transition:box-shadow .28s var(--e-quart), transform .28s var(--e-quart);
}
.node-btn{ display:block; width:100%; border-radius:var(--r); }
.node-btn:hover .frame{
  transform:translateY(-2px);
  box-shadow:0 4px 9px oklch(0.202 0.017 265 / .17), 0 24px 48px -18px oklch(0.202 0.017 265 / .52);
}
.node.sel .frame{ box-shadow:0 0 0 2px var(--accent), var(--shadow-frame); }
.node.dim{ opacity:.38; filter:saturate(.4); }
.node.rejected{ opacity:.5; filter:saturate(.3); }
.node.rejected .node-kind{ color:var(--ink-3); }
.node.rejected.sel{ opacity:.7; }

.node-foot{ font-size:var(--t-meta); line-height:1.35; color:var(--ink-3); padding-left:1px; min-height:15px; }

/* selection furniture, counter-scaled so it stays crisp like real canvas chrome */
.handles{ position:absolute; inset:0; pointer-events:none; }
.handles i{
  position:absolute; width:7px; height:7px;
  background:var(--surface-2); border:1.5px solid var(--accent); border-radius:1px;
  transform:scale(calc(1 / var(--z,1)));
}
.handles i:nth-child(1){ top:-4px; left:-4px; transform-origin:0 0; }
.handles i:nth-child(2){ top:-4px; right:-4px; transform-origin:100% 0; }
.handles i:nth-child(3){ bottom:-4px; left:-4px; transform-origin:0 100%; }
.handles i:nth-child(4){ bottom:-4px; right:-4px; transform-origin:100% 100%; }

.dimbadge{
  position:absolute; top:100%; left:50%;
  margin-top:7px; padding:2px 7px; border-radius:3px;
  background:var(--accent); color:var(--surface-2);
  font-size:var(--t-micro); font-weight:var(--w-mid); letter-spacing:.03em;
  font-variant-numeric:tabular-nums; white-space:nowrap;
  transform:translateX(-50%) scale(calc(1 / var(--z,1)));
  transform-origin:50% 0;
  pointer-events:none; z-index:8;
}

/* ============================================================
   THE DESIGNS — high-fidelity mocks, own type ramp
   ============================================================ */

.ui{
  position:absolute; inset:0;
  padding:11px 11px 10px;
  display:flex; flex-direction:column; gap:7px;
  background:var(--ui-bg); color:var(--ui-text);
  font-size:var(--d-meta); line-height:1.35;
}
.ui-nav{ display:flex; align-items:center; gap:5px; color:var(--ui-text-3); font-size:var(--d-meta); }
.ui-nav .dot{ width:9px; height:9px; border-radius:50%; background:var(--ui-card-2); margin-left:auto; }
.ui-h{ font-size:var(--d-head); font-weight:var(--w-strong); letter-spacing:-.022em; line-height:1.05; }
.ui-h.sm{ font-size:var(--d-body); letter-spacing:-.016em; line-height:1.15; }
.ui-sub{ font-size:var(--d-meta); color:var(--ui-text-2); line-height:1.3; }

.ui-plans{ display:flex; gap:5px; flex:1; min-height:0; }
.pcard{
  flex:1; min-width:0;
  border:1px solid var(--ui-line); border-radius:5px;
  background:var(--ui-card);
  padding:7px 6px;
  display:flex; flex-direction:column; gap:4px;
}
.pcard.rec{ border-color:var(--ui-mint); background:linear-gradient(var(--ui-mint-dk), var(--ui-card)); }
.pname{ font-size:var(--d-meta); font-weight:var(--w-mid); color:var(--ui-text-2); letter-spacing:.02em; }
.pcard.rec .pname{ color:var(--ui-mint); }
.pprice{ font-size:var(--d-head); font-weight:var(--w-strong); letter-spacing:-.03em; line-height:1; }
.pprice s{ font-size:var(--d-micro); font-weight:var(--w-body); color:var(--ui-text-3); text-decoration:none; letter-spacing:0; }
.pfeat{ display:flex; flex-direction:column; gap:2px; margin-top:1px; }
.pfeat span{ display:flex; align-items:center; gap:3px; font-size:var(--d-micro); color:var(--ui-text-3); line-height:1.25; }
.pfeat span::before{ content:""; width:3px; height:3px; border-radius:50%; background:var(--ui-text-3); flex:none; }
.pcard.rec .pfeat span::before{ background:var(--ui-mint); }
.ptag{
  align-self:flex-start; padding:1px 4px; border-radius:2px;
  background:var(--ui-mint); color:var(--ui-mint-dk);
  font-size:var(--d-micro); font-weight:var(--w-strong);
  letter-spacing:.06em; text-transform:uppercase; line-height:1.5;
}

.ui-cta{
  flex:none; height:21px; border-radius:5px;
  display:flex; align-items:center; justify-content:center;
  font-size:var(--d-meta); font-weight:var(--w-mid); letter-spacing:-.01em;
  background:var(--ui-card-2); color:var(--ui-text);
}
.ui-cta.solid{ background:var(--ui-mint); color:var(--ui-mint-dk); }
.ui-cta.ghost{ background:transparent; border:1px solid var(--ui-line); color:var(--ui-text-2); }

.ui-tbl{ flex:1; display:flex; flex-direction:column; gap:3px; min-height:0; }
.trow{ display:flex; align-items:center; gap:4px; }
.trow .tl{ width:38%; font-size:var(--d-micro); color:var(--ui-text-3); }
.trow .tc{ flex:1; display:flex; align-items:center; justify-content:center; font-size:var(--d-micro); color:var(--ui-text-2); }
.trow.head .tc{ flex-direction:column; gap:1px; color:var(--ui-text); }
.trow.head .tc b{ font-size:var(--d-body); font-weight:var(--w-strong); letter-spacing:-.02em; }
.trow.head .tc.rec b{ color:var(--ui-mint); }
.trow.head .tc em{ font-style:normal; font-size:var(--d-micro); color:var(--ui-text-3); }
.trow + .trow{ border-top:1px solid var(--ui-line); padding-top:3px; }
.yes{ color:var(--ui-mint); font-size:var(--d-meta); line-height:1; }
.no{ color:var(--ui-text-3); font-size:var(--d-meta); line-height:1; }

.ui-outcomes{ flex:1; display:flex; flex-direction:column; gap:4px; min-height:0; }
.orow{
  display:flex; align-items:center; gap:6px;
  padding:5px 6px; border-radius:5px;
  border:1px solid var(--ui-line); background:var(--ui-card);
}
.orow.rec{ border-color:var(--ui-mint); background:linear-gradient(90deg, var(--ui-mint-dk), var(--ui-card)); }
.orow .otxt{ flex:1; min-width:0; display:flex; flex-direction:column; gap:1px; }
.orow .otxt b{ font-size:var(--d-meta); font-weight:var(--w-mid); letter-spacing:-.01em; }
.orow .otxt span{ font-size:var(--d-micro); color:var(--ui-text-3); }
.orow .oprice{ font-size:var(--d-body); font-weight:var(--w-strong); letter-spacing:-.02em; flex:none; }
.orow.rec .oprice{ color:var(--ui-mint); }

.ui-ask{ display:flex; flex-direction:column; gap:5px; padding:7px; border-radius:5px; background:var(--ui-card); border:1px solid var(--ui-line); }
.ui-ask b{ font-size:var(--d-meta); font-weight:var(--w-mid); letter-spacing:-.01em; }
.ui-opts{ display:flex; gap:4px; }
.uopt{
  flex:1; text-align:center; padding:3px 2px; border-radius:9px;
  border:1px solid var(--ui-line); color:var(--ui-text-3); font-size:var(--d-micro);
}
.uopt.on{ border-color:var(--ui-mint); background:var(--ui-mint-dk); color:var(--ui-mint); }

.ui-reason{
  display:flex; align-items:flex-start; gap:5px;
  padding:6px; border-radius:5px;
  background:var(--ui-mint-dk); border:1px solid oklch(0.822 0.166 158 / .28);
  font-size:var(--d-micro); line-height:1.4; color:oklch(0.90 0.09 158);
}
.ui-reason::before{ content:""; width:3px; height:3px; border-radius:50%; background:var(--ui-mint); margin-top:3px; flex:none; }

.ui-switch{
  display:flex; align-items:center; gap:5px;
  padding:5px 7px; border-radius:5px;
  border:1px dashed var(--ui-line); color:var(--ui-text-2); font-size:var(--d-meta);
}
.ui-switch span{ margin-left:auto; color:var(--ui-text-3); }

/* the line IS the content of a copy frame, so it gets the design ramp's
   reading size rather than label size */
.ui-copy{
  flex:1; display:flex; align-items:center;
  font-size:var(--d-body); line-height:1.35; font-weight:var(--w-body);
  letter-spacing:-.014em; color:var(--ui-text);
}

.dropframe{
  height:200px; width:100%;
  border-radius:var(--r);
  border:1.5px dashed var(--line-3);
  background:var(--surface);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:11px;
  text-align:center; padding:16px;
}
.dropframe p{ margin:0; font-size:var(--t-meta); color:var(--ink-3); max-width:24ch; line-height:1.45; }
.drop-actions{ display:flex; flex-direction:column; gap:8px; width:100%; max-width:190px; }
.drop-actions .btn{ justify-content:center; }
.drop-actions .btn .ico{ display:flex; flex:none; }

.ghost .frame{ background:var(--surface); box-shadow:none; border:1px dashed var(--line-3); }
.ghost .node-name{ color:var(--ink-4); }
.shimmer{ position:absolute; inset:0; background:linear-gradient(100deg, transparent 20%, var(--accent-8) 50%, transparent 80%); background-size:220% 100%; animation:sweep 1.2s linear infinite; }
@keyframes sweep{ from{ background-position:140% 0; } to{ background-position:-140% 0; } }

/* ---------- branch actions (now live in the reasoning panel) ---------- */

.act{
  position:relative;
  display:flex; align-items:center; gap:9px;
  height:30px; padding:0 10px;
  border-radius:var(--r-sm);
  font-size:var(--t-body); font-weight:var(--w-mid); color:var(--ink); text-align:left;
  transition:background .18s var(--e-quart);
}
.act:hover{ background:var(--surface-2); }
.act .ico{ flex:none; color:var(--ink-3); display:flex; }
.act .meta{ margin-left:auto; font-size:var(--t-micro); font-weight:var(--w-mid); letter-spacing:.09em; text-transform:uppercase; color:var(--ink-4); }
.act.used{ color:var(--accent-2); }
.act.used .ico{ color:var(--accent); }
.act.live{ background:var(--accent-8); color:var(--accent-2); }
.act.live .ico{ color:var(--accent); }
.act.live:hover{ background:var(--accent-12); }

.ready{
  position:absolute; top:100%; left:0; margin-top:10px;
  display:inline-flex; align-items:center; gap:7px;
  height:27px; padding:0 11px; border-radius:20px;
  background:var(--accent); color:var(--surface-2);
  font-size:var(--t-meta); font-weight:var(--w-mid); letter-spacing:-.005em; white-space:nowrap;
  box-shadow:var(--shadow-2);
  animation:pop .44s var(--e-expo) both;
}
.ready::before{ content:""; width:5px; height:5px; border-radius:50%; background:var(--surface-2); animation:blip 1.8s var(--e-quart) infinite; }
@keyframes blip{ 0%,100%{ opacity:1; } 50%{ opacity:.35; } }

/* ============================================================
   COACHING
   ============================================================ */

/* A ring at the target's own edge that scales outward while it fades,
   then resets and does it again — a ping, not a static box. Reads as
   "something is happening here" without ever looking boxed-in. */
.coach{ position:relative; }
.coach::after{
  content:""; position:absolute; inset:-5px;
  border-radius:12px; border:1px solid var(--accent-40);
  background:var(--accent-16);
  pointer-events:none; z-index:3;
  transform-origin:center; animation:coachglow 1.8s cubic-bezier(0,0,.2,1) infinite;
}
@keyframes coachglow{
  0%{ transform:scale(1); opacity:.9; }
  100%{ transform:scale(1.4); opacity:0; }
}

/* The next-step menu floats beside the selected node on the canvas —
   what to do next sits next to the thing it acts on, not in a side
   panel. It's positioned in the node's own coordinate space (see
   renderNodeMenu) so panning/zooming carries it along for free, and
   counter-scaled like the other canvas chrome so it stays a comfortable,
   legible size at any zoom level instead of shrinking with the graph. */
.nodemenu{
  position:absolute; top:0; left:0; width:240px;
  transform-origin:0 0; transform:scale(calc(1 / var(--z,1)));
  display:flex; flex-direction:column; gap:10px;
  padding:14px;
  background:var(--surface); border:1px solid var(--line-2); border-radius:var(--r-lg);
  box-shadow:var(--shadow-3);
  animation:nodemenuIn .22s var(--e-quart) both;
  z-index:7;
}
/* Counter-scaled like .node's own selection furniture (see .handles),
   so it can't reuse the .node "pop" keyframe: that animation's own
   end-state sets transform:none, which would win over (and permanently
   cancel) the static counter-scale above once the animation completes. */
@keyframes nodemenuIn{ from{ opacity:0; } to{ opacity:1; } }
.nodemenu-label{ font-size:var(--t-micro); font-weight:var(--w-mid); letter-spacing:.09em; text-transform:uppercase; color:var(--ink-4); }
.nodemenu-acts.flash .act-list{ animation:flashring .9s var(--e-quart); }

/* ---- the 40px below a selected node --------------------------------
   Two things want that strip: the foot caption and the dimension badge
   (plus, on the finished path, the "ready" pill). Fixed at the cause
   rather than by nudging offsets. */

/* A selected node owns the top layer, so the ready pill never paints
   under a neighbour that happens to sit lower in the DOM. */
.node.sel{ z-index:20; }

/* The foot repeats the exact string the reasoning panel shows as its
   subtitle, so it is redundant precisely when the node is selected,
   and its 15px is where the badge (or the ready pill) lands. */
.node.sel .node-foot{ visibility:hidden; }

/* ============================================================
   CANVAS FURNITURE
   ============================================================ */

.toolrail{
  position:absolute; right:var(--float-gap); top:50%;
  transform:translateY(-50%);
  width:var(--rail-w);
  display:flex; flex-direction:column; gap:2px;
  padding:5px; border-radius:20px;
  background:var(--surface); border:1px solid var(--line);
  box-shadow:var(--shadow-2);
  z-index:35;
}
.tool{
  width:32px; height:32px;
  display:flex; align-items:center; justify-content:center;
  border-radius:50%;
  color:var(--ink-3);
  transition:background .2s var(--e-quart), color .2s var(--e-quart);
}
.tool:hover{ background:var(--surface-2); color:var(--ink); }
.tool.on{ background:var(--ink); color:var(--surface-2); }
.toolrail .sep{ height:1px; margin:3px 6px; background:var(--line-2); }

/* Focus mode moves the status and zoom clusters with transforms, never with
   left/right: animating layout properties forces reflow every frame. */
.canvasfoot{
  position:absolute; bottom:var(--float-gap);
  left:var(--float-gap);
  right:calc(var(--float-gap)*2 + var(--rail-w));
  display:flex; align-items:center; justify-content:space-between;
  pointer-events:none; z-index:25;
}
.canvasfoot > *{ pointer-events:auto; }
.canvasfoot .status{ transform:translateX(calc(var(--panel-l-w) + var(--float-gap))); }
.canvasfoot .zoom{ transform:translateX(calc(-1 * (var(--panel-r-w) + var(--float-gap)))); }
.canvasfoot .status,.canvasfoot .zoom{ transition:transform .34s var(--e-quint); }
.app.focusmode .canvasfoot .status,
.app.focusmode .canvasfoot .zoom{ transform:none; }

/* Solid, not glass. A blur here would be decoration: there is nothing
   meaningful behind these to see through to. */
@property --ang{ syntax:'<angle>'; initial-value:0deg; inherits:false; }

.status{
  position:relative;
  display:flex; align-items:center; gap:9px;
  height:29px; padding:0 12px;
  border-radius:20px;
  border:1px solid var(--line);
  background:var(--surface);
  box-shadow:var(--shadow-1);
  font-size:var(--t-meta); letter-spacing:.02em;
  color:var(--ink-3); font-variant-numeric:tabular-nums;
}
.status b{ color:var(--ink-2); font-weight:var(--w-mid); }
.status .live-dot{ width:5px; height:5px; border-radius:50%; background:var(--accent); animation:blip 1.1s var(--e-quart) infinite; }
.status .gen{ color:var(--accent-2); display:none; align-items:center; gap:7px; }
.status.busy .gen{ display:flex; }
.status.busy .idle{ display:none; }

/* A slow rotating gradient ring reads as "working", not "broken" — the
   faded coach glow already owns the plain pulsing-opacity vocabulary. */
.status.busy::after{
  content:""; position:absolute; inset:-1.5px;
  border-radius:22px; padding:1.5px;
  background:conic-gradient(from var(--ang, 0deg), transparent 0%, var(--accent) 18%, transparent 40%);
  -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite:xor; mask-composite:exclude;
  animation:ringspin 1.6s linear infinite;
  pointer-events:none;
}
@keyframes ringspin{ to{ --ang:360deg; } }

.zoom{
  display:flex; align-items:center; gap:1px;
  padding:3px; border-radius:20px;
  border:1px solid var(--line);
  background:var(--surface);
  box-shadow:var(--shadow-1);
}
.zbtn{ width:26px; height:23px; display:flex; align-items:center; justify-content:center; border-radius:20px; color:var(--ink-2); transition:background .18s var(--e-quart); }
.zbtn:hover{ background:var(--paper-deep); color:var(--ink); }
.zval{ min-width:40px; text-align:center; font-size:var(--t-meta); color:var(--ink-3); font-variant-numeric:tabular-nums; }

/* ============================================================
   EXPORT SHEET
   ============================================================ */

.sheet{
  position:absolute; left:50%; bottom:58px;
  transform:translateX(-50%) translateY(10px);
  width:min(480px, calc(100% - 40px));
  padding:18px 20px;
  border-radius:var(--float-r);
  border:1px solid var(--line);
  background:var(--surface);
  box-shadow:var(--shadow-3);
  z-index:38; opacity:0; pointer-events:none;
  transition:opacity .34s var(--e-quart), transform .44s var(--e-expo);
}
.sheet.on{ opacity:1; transform:translateX(-50%) translateY(0); pointer-events:auto; }
.sheet-head{ display:flex; align-items:center; gap:9px; margin-bottom:13px; }
.sheet-head h4{ margin:0; font-size:var(--t-lead); font-weight:var(--w-strong); letter-spacing:-.018em; }
.sheet-head .ok{ width:18px; height:18px; border-radius:50%; background:var(--accent); color:var(--surface-2); display:flex; align-items:center; justify-content:center; flex:none; }
.path{
  display:flex; align-items:center; flex-wrap:wrap; gap:7px;
  padding:12px 13px; border-radius:var(--r-sm);
  background:var(--surface-2); border:1px solid var(--line-2);
  margin-bottom:14px;
}
.path-step{ font-size:var(--t-meta); letter-spacing:-.004em; color:var(--ink); }
.path-arrow{ color:var(--ink-4); font-size:var(--t-meta); }
.sheet-foot{ display:flex; align-items:center; gap:9px; }
.sheet-note{ font-size:var(--t-meta); color:var(--ink-3); margin-left:auto; }

/* A quick, transient receipt for a single-node export: lighter than the
   sheet, which stays reserved for the full scripted path. */
.toast{
  position:absolute; left:50%; top:calc(var(--bar-h) + 14px);
  transform:translateX(-50%) translateY(-8px);
  display:flex; align-items:center; gap:8px;
  padding:9px 16px;
  border-radius:20px;
  background:var(--ink); color:var(--surface-2);
  font-size:var(--t-meta); font-weight:var(--w-mid); letter-spacing:-.003em;
  box-shadow:var(--shadow-2);
  z-index:50; opacity:0; pointer-events:none;
  transition:opacity .28s var(--e-quart), transform .34s var(--e-expo);
}
.toast.on{ opacity:1; transform:translateX(-50%) translateY(0); }
.toast .ico{ display:flex; flex:none; color:var(--accent); }

/* ============================================================
   RESPONSIVE
   ============================================================ */

@media (max-width:1280px){
  :root{ --panel-l-w:262px; --panel-r-w:292px; }
  .panel-body{ padding:14px 15px 20px; }
  .panel-head{ padding:14px 15px 11px; }
}
@media (max-width:1040px){
  .file{ display:none; }
  .steplabel{ max-width:118px; overflow:hidden; text-overflow:ellipsis; }
}
@media (max-width:900px){
  html,body{ overflow:auto; }
  .app{ height:auto; min-height:100dvh; overflow:visible; display:flex; flex-direction:column; }
  .bar{ position:sticky; top:0; height:auto; flex-wrap:wrap; gap:10px; padding:10px 12px; background:var(--paper); }
  .bar::before{ display:none; }
  .steppill{ position:static; transform:none; order:3; width:100%; justify-content:center; }
  .canvas{ position:relative; inset:auto; height:58vh; min-height:380px; order:2; }
  .panel{ position:static; width:auto; margin:0 12px 12px; }
  .panel-l{ order:3; }
  .panel-r{ order:4; }
  .toolrail{ display:none; }
  .canvasfoot{ left:12px; right:12px; }
  .canvasfoot .status,.canvasfoot .zoom{ transform:none; }
  .app.focusmode .panel{ opacity:1; transform:none; pointer-events:auto; }
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.001ms !important;
    animation-iteration-count:1 !important;
    transition-duration:.001ms !important;
  }
  .layer.eased{ transition:none; }
}

<div class="app" id="app">

<script>
(() => {
  "use strict";

  const W = 280, H = 200, OFF = 400;

  /* ==========================================================
     THE DESIGNS
     ========================================================== */

  const PLANS = [
    { name: "Basic", price: "6",  feats: ["2 orders / wk", "Standard delivery"] },
    { name: "Plus",  price: "12", feats: ["Unlimited orders", "Free delivery", "Cancel anytime"] },
    { name: "Pro",   price: "24", feats: ["Everything in Plus", "Family sharing"] }
  ];

  const nav = (crumb) => `<div class="ui-nav">‹ ${crumb}<span class="dot"></span></div>`;

  const card = (p, rec) => `
    <div class="pcard${rec ? " rec" : ""}">
      ${rec ? '<span class="ptag">Recommended</span>' : ""}
      <span class="pname">${p.name}</span>
      <span class="pprice">$${p.price}<s>/mo</s></span>
      <span class="pfeat">${p.feats.map((f) => `<span>${f}</span>`).join("")}</span>
    </div>`;

  const MOCK = {
    root: () => `
      ${nav("Plans")}
      <div class="ui-h">Choose your plan</div>
      <div class="ui-sub">Cancel or switch at any time.</div>
      <div class="ui-plans">${PLANS.map((p) => card(p, false)).join("")}</div>
      <div class="ui-cta ghost">Continue</div>`,

    guided: () => `
      ${nav("Plans")}
      <div class="ui-h">Our pick for you</div>
      <div class="ui-sub">Based on how you have been ordering.</div>
      <div class="ui-plans">${PLANS.map((p, i) => card(p, i === 1)).join("")}</div>
      <div class="ui-cta solid">Choose Plus, $12/mo</div>`,

    compare: () => {
      const rows = [
        ["Orders per week", "2", "∞", "∞"],
        ["Free delivery", "no", "yes", "yes"],
        ["Priority support", "no", "yes", "yes"],
        ["Family sharing", "no", "no", "yes"]
      ];
      const mark = (v) => v === "yes" ? '<span class="yes">✓</span>' : v === "no" ? '<span class="no">–</span>' : v;
      return `
        ${nav("Plans")}
        <div class="ui-h sm">Compare all three</div>
        <div class="ui-tbl">
          <div class="trow head">
            <span class="tl"></span>
            ${PLANS.map((p, i) => `<span class="tc${i === 1 ? " rec" : ""}"><b>${p.name}</b><em>$${p.price}/mo</em></span>`).join("")}
          </div>
          ${rows.map((r) => `
          <div class="trow">
            <span class="tl">${r[0]}</span>
            <span class="tc">${mark(r[1])}</span>
            <span class="tc">${mark(r[2])}</span>
            <span class="tc">${mark(r[3])}</span>
          </div>`).join("")}
        </div>
        <div class="ui-cta ghost">Select a plan</div>`;
    },

    outcome: () => `
      ${nav("Plans")}
      <div class="ui-h sm">What do you want to stop thinking about?</div>
      <div class="ui-outcomes">
        <div class="orow"><span class="otxt"><b>Order now and then</b><span>Two orders a week, standard delivery</span></span><span class="oprice">$6</span></div>
        <div class="orow rec"><span class="otxt"><b>Never think about delivery fees</b><span>Unlimited orders, always free delivery</span></span><span class="oprice">$12</span></div>
        <div class="orow"><span class="otxt"><b>Cover the whole household</b><span>Everything in Plus, shared with 4 people</span></span><span class="oprice">$24</span></div>
      </div>
      <div class="ui-cta ghost">See full plan details</div>`,

    needs: () => `
      ${nav("Plans")}
      <div class="ui-ask">
        <b>How often do you order?</b>
        <div class="ui-opts">
          <span class="uopt">Rarely</span>
          <span class="uopt">Monthly</span>
          <span class="uopt on">Weekly</span>
        </div>
      </div>
      <div class="ui-plans">${card(PLANS[1], true)}</div>
      <div class="ui-cta solid">Continue with Plus</div>`,

    confidence: () => `
      ${nav("Plans")}
      <div class="ui-h sm">Plus fits how you order</div>

  const resolved = () => state.step >= 8;

  const $ = (s) => document.querySelector(s);
  const app = $("#app"), canvas = $("#canvas"), layer = $("#layer"), wires = $("#wires");
  const nodesEl = $("#nodes"), reason = $("#reason"), ctxEl = $("#ctx"), nodemenuEl = $("#nodemenu");
  const status = $("#status"), sheet = $("#sheet"), exportBtn = $("#export");
  const panelR = document.querySelector(".panel-r"), toast = $("#toast");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  const ICON = {

  /* Shared by every live action: how many of the pre-authored variants to

  function optionActionsHTML(id) {

  /* What-can-I-do-next floats beside the node it acts on (see
     renderNodeMenu), not inside the reasoning panel — the panel is for
     why-does-this-exist, the canvas is for what-happens-next. */
  function branchActionsHTML(id) {
    const n = N[id];

    if (id === "root") {
      if (state.step !== 2) return "";
      const live = !!coachTip("act", "root", "start");
      return `
        <div class="nodemenu-acts">
          <span class="nodemenu-label">Start here</span>
          ${exploreControlsHTML()}

        </div>`;
    }
    if (n.kind === "Copy") return "";

    const t = STEPS[state.step] && STEPS[state.step].on;
    const liveAct = t && t.type === "act" && t.node === id ? t.act : null;
    let hasLive = false;

    /* Every option reads as equally choosable — no greyed-out, padlocked
       rows. Only the live one is actually wired up for this walkthrough;
       the others quietly say so if you try them (see the nodemenu click
       handler), rather than looking broken or off-limits. */
    const rows = ACTS.map((a) => {
      const spent = state.spent.has(id + ":" + a.id);

     coordinate space as the node cards (see the .node left/top styles

  function renderNodeMenu() {

    const s = STEPS[state.step];
    if (!s || state.done) return null;
    const t = s.on;
    if (kind === "node" && t.type === "node" && t.node === nodeId) return s.tip;
    if (kind === "act"  && t.type === "act"  && t.node === nodeId && t.act === actId) return s.tip;

  function render() {
    const onPath = resolved();
    const parts = [];

    if (!state.placed) {

    renderWires(); renderContext(); renderReason(); renderNodeMenu(); renderRail(); renderTally();

  function renderWires() {
    const paths = [];
    for (const id of state.shown) {
      const n = N[id];
      if (!n.parent || !state.shown.has(n.parent)) continue;
      const p = N[n.parent];
      const x1 = p.x + W + OFF, y1 = p.y + H / 2 + OFF;
      const x2 = n.x + OFF,     y2 = n.y + H / 2 + OFF;
      const dx = Math.max(40, (x2 - x1) * 0.5);
      const lit = resolved() && PATH.includes(id) && PATH.includes(n.parent);
      paths.push(`<path class="wire${lit ? " lit" : ""}${resolved() && !lit ? " dim" : ""}"
        d="M ${x1} ${y1} C ${x1 + dx} ${y1}, ${x2 - dx} ${y2}, ${x2} ${y2}"/>`);
    }

  /* Problem/Persona/Goal read from state.form both before and after

  /* No permanent caption under the segmented control — the description
     of an option only matters while you're choosing it, so it rides

  function rangeHTML() {
    return `
      <div class="seg" id="fRange" role="group" aria-label="Creative range">
        ${Object.keys(RANGE_NOTE).map((k) =>
          `<button type="button" data-range="${k}" class="${k === state.range ? "on" : ""}" title="${esc(RANGE_NOTE[k])}">${k}</button>`
        ).join("")}
      </div>`;
  }

  function designSystemHTML() {
    return `
      <select class="inp" id="fDesignSystem" data-form-select="designSystem" aria-label="Design system">
        ${DESIGN_SYSTEMS.map((d) =>
          `<option value="${esc(d)}"${d === state.form.designSystem ? " selected" : ""}>${esc(d)}</option>`
        ).join("")}
      </select>`;
  }

  function renderContext() {
    const head = $("#ctxHead"), stateChip = $("#ctxState");

    /* A brief "reading" beat right after placement — the fields below
       land pre-filled either way, but this is what makes that feel like
       something Diverge just did, not boilerplate that was always there. */
    if (state.analyzing) {
      head.textContent = "Project context";
      stateChip.textContent = "Analyzing…";
      ctxEl.innerHTML = `
        <div class="blank">
          <p>Reading the screen — drafting a problem, persona and goal to start from…</p>
          <span class="barline m"></span><span class="barline s"></span><span class="barline m"></span>
        </div>`;
      return;
    }

    if (state.step === 1) {
      head.textContent = "Project context";
      stateChip.textContent = "Step 2";
      ctxEl.innerHTML = `
        <div class="setup-lede">
          <h3>Drafted from your screen</h3>
          <p>A starting point Diverge pulled from what you placed — check it, adjust anything, and it stays editable after, too.</p>
        </div>
        <div class="group">
          <div class="field">
            <label class="field-q" for="fProblem">${FIELD_LABELS.problem}</label>
            <textarea class="inp" id="fProblem" data-form="problem" rows="2">${esc(state.form.problem)}</textarea>
          </div>
          <div class="field">
            <label class="field-q" for="fPersona">${FIELD_LABELS.persona}</label>
            <textarea class="inp" id="fPersona" data-form="persona" rows="2">${esc(state.form.persona)}</textarea>
          </div>
          <div class="field">
            <label class="field-q" for="fGoal">${FIELD_LABELS.goal}</label>
            <textarea class="inp" id="fGoal" data-form="goal" rows="2">${esc(state.form.goal)}</textarea>
          </div>
        </div>
        <div class="field">
          <span class="label">Constraints</span>
          ${constraintsHTML()}
        </div>
        <div class="field">
          <span class="label">Creative range</span>
          ${rangeHTML()}
        </div>
        <div class="field">
          <span class="label">Design system</span>
          ${designSystemHTML()}
        </div>
        <button class="btn btn-primary setup-go" id="setContext" type="button">Set context</button>`;
      return;
    }

    head.textContent = "Project context";
    stateChip.textContent = state.contextSet ? state.range : "Empty";

    if (!state.contextSet) {
      ctxEl.innerHTML = `
        <div class="blank">
          <p>Diverge turns one screen into several directions, concepts and copy — each with the reasoning behind it. Place a screen to begin; we'll draft a starting problem, persona and goal from it.</p>
          <span class="barline m"></span><span class="barline s"></span><span class="barline m"></span>
        </div>`;
      return;
    }

    ctxEl.innerHTML = `
      <div class="field">
        <span class="label">Current screen</span>
        <span class="field-value strong">${N.root.name}</span>
      </div>
      <div class="rule"></div>
      <div class="group">
        ${editableFieldHTML("problem", FIELD_LABELS.problem)}
        ${editableFieldHTML("persona", FIELD_LABELS.persona)}
        ${editableFieldHTML("goal", FIELD_LABELS.goal)}
      </div>
      <div class="field">
        <span class="label">Constraints</span>
        ${constraintsHTML()}
      </div>
      <div class="field">
        <span class="label">Creative range</span>
        ${rangeHTML()}
      </div>
      <div class="field">
        <span class="label">Design system</span>
        ${designSystemHTML()}
      </div>`;
  }

  function renderReason() {
    const id = state.selected, countEl = $("#reasonCount");

    /* Nothing to reason about until something is selected: collapse the
       panel entirely rather than show it holding a placeholder. */
    panelR.classList.toggle("collapsed", !id);
    if (!id) {
      countEl.textContent = "No selection";
      reason.innerHTML = `<div class="blank"><p>Select any frame on the canvas to read why that direction exists, what it trades away, and what still needs validating.</p></div>`;
      return;
    }
    const n = N[id];
    countEl.textContent = n.kind;

    if (!n.r) {
      reason.innerHTML = `
        <div class="reason-title"><span class="kind">${n.kind}</span><h3>${n.name}</h3><span class="sub">${n.note}</span></div>
        <div class="reason-list">
          <div class="reason-item"><span class="label">Held constant</span>
            <p>${state.contextSet ? esc(state.form.constraints.join(" · ")) : "No constraints set yet."} Every branch inherits these.</p></div>
        </div>`;
      return;
    }

    const isCopy = n.kind === "Copy";
    reason.innerHTML = `
      <div class="reason-title"><span class="kind">${n.kind}</span><h3>${n.name}</h3><span class="sub">${n.foot}</span></div>
      ${optionActionsHTML(id)}
      ${isCopy ? `<div class="quote-block">${n.copy}</div>` : ""}
      <div class="reason-list">
        <div class="reason-item"><span class="label">Why this ${isCopy ? "line" : "direction"} exists</span><p>${n.r.why}</p></div>
        <div class="reason-item"><span class="label">Strength</span><p>${n.r.strength}</p></div>
        <div class="reason-item"><span class="label">Trade-off</span><p>${n.r.tradeoff}</p></div>
        <div class="reason-item"><span class="label">Assumption</span><p>${n.r.assumption}</p></div>
        <div class="reason-item risk"><span class="label">Risk to validate</span><p>${n.r.risk}</p></div>
      </div>
      <div class="reason-export">
        <span class="label">Export this ${n.kind.toLowerCase()}</span>
        <div class="export-row">
          <button class="xbtn" type="button" data-export="code" data-name="${esc(n.name)}"><span class="ico">${ICON.code}</span>Export to code</button>
          <button class="xbtn" type="button" data-export="figma" data-name="${esc(n.name)}"><span class="ico">${ICON.figma}</span>Export to Figma</button>
        </div>
      </div>`;
  }

  const EL_TARGETS = ["#setContext", "#export"];

  function renderElCoach() {
    for (const sel of EL_TARGETS) {
      const el = $(sel);
      if (el) el.classList.remove("coach");
    }
    const s = STEPS[state.step];
    if (state.done || !s || s.on.type !== "el") return;
    const el = $(s.on.el);
    if (el) el.classList.add("coach");
  }

  /* One guide, always in the same place next to the step counter, instead
     of a tip bubble scattered next to whichever element is live. The
     target itself still gets the .coach glow — this just says what it
     does and what happens next. */
  function renderRail() {
    $("#ticks").innerHTML = STEPS.map((_, i) =>
      `<span class="tick ${state.done || i < state.step ? "done" : i === state.step ? "now" : ""}"></span>`).join("");
    $("#stepLabel").innerHTML = state.done
      ? `<b>Done</b> · direction selected`
      : `<b>${state.step + 1}</b>/${STEPS.length} · ${STEPS[state.step].label}`;
    $("#stepGuide").textContent = state.done ? "" : STEPS[state.step].tip;
    $("#stepDivider").style.display = state.done ? "none" : "";
    exportBtn.hidden = state.step < 8;
    renderElCoach();
  }

  function renderTally() {
    const live = (g) => GROUPS[g].filter((k) => state.shown.has(k) && !state.pending.has(k)).length;
    $("#sNodes").textContent = state.shown.size - state.pending.size;
    $("#sLevels").textContent = (state.placed ? 1 : 0) + (live("directions") ? 1 : 0) + (live("concepts") ? 1 : 0) + (live("copy") ? 1 : 0);
  }

  /* ==========================================================
     VIEWPORT
     ========================================================== */

  function fitRegion() {
    const r = canvas.getBoundingClientRect();
    let left = r.left + 30, right = r.right - 30, top = r.top + 78, bottom = r.bottom - 66;
    if (!app.classList.contains("focusmode")) {
      const l = document.querySelector(".panel-l").getBoundingClientRect();
      if (l.width) left = l.right + 26;
      /* panel-r collapses whenever nothing is selected, so the canvas
         should reclaim that width rather than fit around a hidden panel. */
      if (!panelR.classList.contains("collapsed")) {
        const rt = panelR.getBoundingClientRect();
        if (rt.width && rt.left > left) right = rt.left - 26;
      }
    }
    if (right - left < 240 || bottom - top < 200) {
      return { w: Math.max(320, r.width - 60), h: Math.max(240, r.height - 120), cx: r.width / 2, cy: r.height / 2 };
    }
    return { w: right - left, h: bottom - top, cx: left - r.left + (right - left) / 2, cy: top - r.top + (bottom - top) / 2 };
  }

  function applyView(eased) {
    const { x, y, z } = state.view;
    layer.classList.toggle("eased", !!eased && !reduce);
    layer.style.transform = `translate(${x}px, ${y}px) scale(${z})`;
    layer.style.setProperty("--z", z);
    canvas.style.backgroundSize = `${24 * z}px ${24 * z}px`;
    canvas.style.backgroundPosition = `${x}px ${y}px`;
    $("#zVal").textContent = Math.round(z * 100) + "%";
  }

  function fitTo(ids, eased = true) {
    const list = ids.filter((id) => id === "placeholder" || state.shown.has(id));
    if (!list.length) return;
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    for (const id of list) {
      const n = id === "placeholder" ? N.root : N[id];
      x0 = Math.min(x0, n.x); y0 = Math.min(y0, n.y - 24);
      x1 = Math.max(x1, n.x + W); y1 = Math.max(y1, n.y + H + 58);
    }
    const reg = fitRegion();
    const z = Math.max(0.4, Math.min(1.05, Math.min(reg.w / (x1 - x0), reg.h / (y1 - y0))));
    state.view.z = z;
    state.view.x = reg.cx - ((x0 + x1) / 2) * z;
    state.view.y = reg.cy - ((y0 + y1) / 2) * z;
    applyView(eased);
  }

  function zoomBy(f) {
    const r = canvas.getBoundingClientRect(), cx = r.width / 2, cy = r.height / 2;
    const z = Math.max(0.28, Math.min(1.7, state.view.z * f));
    state.view.x = cx - (cx - state.view.x) * (z / state.view.z);
    state.view.y = cy - (cy - state.view.y) * (z / state.view.z);
    state.view.z = z;
    applyView(true);
  }

  let drag = null;
  canvas.addEventListener("pointerdown", (e) => {
    if (state.tool === "select" && e.target.closest("button")) return;
    drag = { x: e.clientX, y: e.clientY, vx: state.view.x, vy: state.view.y };
    canvas.classList.add("dragging");
    canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener("pointermove", (e) => {
    if (!drag) return;
    state.view.x = drag.vx + (e.clientX - drag.x);
    state.view.y = drag.vy + (e.clientY - drag.y);
    applyView(false);
  });
  const endDrag = () => { drag = null; canvas.classList.remove("dragging"); };
  canvas.addEventListener("pointerup", endDrag);
  canvas.addEventListener("pointercancel", endDrag);
  canvas.addEventListener("wheel", (e) => { e.preventDefault(); zoomBy(e.deltaY > 0 ? 0.93 : 1.075); }, { passive: false });

  /* Clicking the blank canvas — not a node — clears the selection, which
     is what sends the reasoning panel back into its collapsed state. */
  canvas.addEventListener("click", (e) => {
    if (e.target.closest(".node")) return;
    if (state.selected) { state.selected = null; render(); }
  });

  /* ==========================================================
     FLOW
     ========================================================== */

  let toastTimer = null;
  function showToast(msg) {
    clearTimeout(toastTimer);
    toast.innerHTML = `<span class="ico">${ICON.check}</span>${msg}`;
    toast.classList.add("on");
    toastTimer = setTimeout(() => toast.classList.remove("on"), 2400);
  }

  function exploreLabel(noun, count, prompt) {
    const base = `Generating ${count} ${noun}${count === 1 ? "" : "s"}…`;
    return prompt ? `${base.slice(0, -1)} — "${prompt}"…` : base;
  }

  reason.addEventListener("click", (e) => {
    const xb = e.target.closest("[data-export]");
    if (xb) {
      showToast(`Exported "${xb.dataset.name}" to ${xb.dataset.export === "figma" ? "Figma" : "code"}`);
      return;
    }

    const diverge = e.target.closest("[data-diverge]");
    if (diverge) {
      const sec = nodemenuEl.querySelector(".nodemenu-acts");
      if (sec) { sec.classList.remove("flash"); void sec.offsetWidth; sec.classList.add("flash"); }
      return;
    }

    const rejectBtn = e.target.closest("[data-reject]");
    if (rejectBtn) { state.rejectingId = rejectBtn.dataset.reject; render(); return; }

    const cancelReject = e.target.closest("[data-cancel-reject]");
    if (cancelReject) { state.rejectingId = null; render(); return; }

    const confirmReject = e.target.closest("[data-confirm-reject]");
    if (confirmReject) {
      const rid = confirmReject.dataset.confirmReject;
      const val = (reason.querySelector("#rejectReason")?.value || "").trim() || "No reason given";
      state.rejected.set(rid, val);
      state.rejectingId = null;
      render();
      showToast(`Marked "${N[rid].name}" as rejected`);
      return;
    }

    const unreject = e.target.closest("[data-unreject]");
    if (unreject) { state.rejected.delete(unreject.dataset.unreject); render(); return; }
  });

  /* The explore actions (concept/layout/copy, or the root's "start")
     live in the floating canvas menu now, not the reasoning panel — see
     renderNodeMenu. */
  nodemenuEl.addEventListener("click", (e) => {
    const act = e.target.closest("[data-act]");
    if (!act || act.disabled) return;
    const a = act.dataset.act;
    if (a !== "start" && !act.classList.contains("live")) {
      showToast("Not part of this walkthrough yet");
      return;
    }
    const countEl = nodemenuEl.querySelector("#exploreCount");
    const promptEl = nodemenuEl.querySelector("#explorePrompt");
    const count = Math.max(1, Math.min(3, parseInt(countEl && countEl.value, 10) || 3));
    const prompt = (promptEl && promptEl.value.trim()) || "";
    state.exploreCount = count;
    state.explorePrompt = prompt;

    if (a === "start") {
      advance(); state.selected = null;
      generate("directions", exploreLabel("direction", count, prompt), GROUPS.directions.slice(0, count), count);
      return;
    }
    state.spent.add(act.dataset.node + ":" + a);
    advance();
    if (a === "concept") {
      generate("concepts", exploreLabel("concept", count, prompt), ["guided", ...GROUPS.concepts.slice(0, count)], count);
    } else if (a === "copy") {
      generate("copy", exploreLabel("copy variant", count, prompt), ["confidence", ...GROUPS.copy.slice(0, count)], count);
    }
  });

  function generate(group, label, focus, count) {
    if (state.busy) return;
    state.busy = true;
    status.classList.add("busy");
    $("#sGen").textContent = label;
    GROUPS[group].slice(0, count).forEach((id) => { state.shown.add(id); state.pending.add(id); });
    render();
    fitTo(focus);
    setTimeout(() => {
      state.pending.clear(); state.busy = false;
      status.classList.remove("busy");
      render();
    }, reduce ? 60 : 1700);
  }

  const advance = () => { state.step += 1; };

  function select(id) {
    const closesPath = state.step === 7 && id === "lowpress";
    state.selected = id;
    const s = STEPS[state.step];
    if (!state.done && s && s.on.type === "node" && s.on.node === id) advance();
    render();
    if (closesPath) fitTo(PATH);
    nudgeForMenu();
  }

  /* Selecting a node can open both the reasoning panel and a canvas menu
     beside it in the same tick — a corrective pan (not a re-fit/re-zoom)
     for the case where the menu now lands partly behind whichever is on
     its right (the panel, or the canvas edge). Runs after any fitTo()
     above so it always has the settled view to check against. */
  function nudgeForMenu() {
    const menu = nodemenuEl.firstElementChild;
    if (!menu) return;
    const rect = menu.getBoundingClientRect();
    const limit = panelR.classList.contains("collapsed")
      ? canvas.getBoundingClientRect().right - 26
      : panelR.getBoundingClientRect().left - 26;
    const overshoot = rect.right - limit;
    if (overshoot > 0) { state.view.x -= overshoot; applyView(true); }
  }

  nodesEl.addEventListener("click", (e) => {
    const act = e.target.closest("[data-act]");
    if (act && act.dataset.act === "figma-import") {
      showToast("Not part of this walkthrough yet");
      return;
    }
    if (act && !act.disabled && act.dataset.act === "place") {
      if (state.busy) return;
      state.busy = true;
      status.classList.add("busy");
      $("#sGen").textContent = "Uploading screen…";
      render();
      setTimeout(() => {
        /* Upload finishes, but the busy pill stays lit through a second,
           shorter beat: reading the screen for a draft problem/persona/
           goal before handing the form over (see renderContext's
           state.analyzing branch). Advance only happens once that's done. */
        state.busy = false;
        state.placed = true; state.shown.add("root");
        state.analyzing = true;
        status.classList.add("busy");
        $("#sGen").textContent = "Reading screen…";
        render(); fitTo(["root"]);
        setTimeout(() => {
          state.analyzing = false;
          status.classList.remove("busy");
          advance();
          render();
        }, reduce ? 60 : 1100);
      }, reduce ? 60 : 1300);
      return;
    }
    const btn = e.target.closest("[data-select]");
    if (btn) select(btn.dataset.select);
  });

  /* the form writes back to state on input, so a re-render never loses typing */
  ctxEl.addEventListener("input", (e) => {
    const k = e.target.dataset && e.target.dataset.form;
    if (k) state.form[k] = e.target.value;
  });

  ctxEl.addEventListener("keydown", (e) => {
    if (e.key !== "Enter" || e.target.id !== "fConstraintAdd") return;
    e.preventDefault();
    const v = e.target.value.trim();
    if (!v) return;
    state.form.constraints.push(v);
    render();
    const fresh = $("#fConstraintAdd");
    if (fresh) fresh.focus();
  });

  ctxEl.addEventListener("click", (e) => {
    const drop = e.target.closest("[data-drop]");
    if (drop) { state.form.constraints.splice(+drop.dataset.drop, 1); render(); return; }

    const rng = e.target.closest("[data-range]");
    if (rng) { state.range = rng.dataset.range; render(); return; }

    const editBtn = e.target.closest("[data-editfield]");
    if (editBtn) {
      state.editingField = editBtn.dataset.editfield;
      render();
      const el = ctxEl.querySelector(`[data-form="${state.editingField}"]`);
      if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
      return;
    }

    if (e.target.closest("#setContext")) {
      if (state.step !== 1) return;
      state.contextSet = true;
      advance(); render(); fitTo(["root"]);
    }
  });

  /* Closes an in-place edit back to plain text once the field loses
     focus — click elsewhere, or tab away, both commit it. */
  ctxEl.addEventListener("focusout", (e) => {
    const k = e.target.dataset && e.target.dataset.form;
    if (k && state.editingField === k) { state.editingField = null; render(); }
  });

  ctxEl.addEventListener("change", (e) => {
    const k = e.target.dataset && e.target.dataset.formSelect;
    if (k) { state.form[k] = e.target.value; render(); }
  });

  exportBtn.addEventListener("click", () => {
    if (state.step < 8) return;
    state.done = true;
    exportBtn.classList.remove("coach");
    exportBtn.textContent = "Exported";
    /* built from the tree, never hardcoded, so the receipt cannot drift
       from the frame names the reviewer just clicked through */
    $("#pathOut").innerHTML = PATH
      .map((id) => `<span class="path-step">${esc(N[id].name)}${N[id].kind === "Copy" ? " copy" : ""}</span>`)
      .join('<span class="path-arrow">\u2192</span>');
    sheet.classList.add("on");
    render(); fitTo(PATH);
  });

  function setTool(t) {
    state.tool = t;
    $("#tSelect").classList.toggle("on", t === "select");
    $("#tPan").classList.toggle("on", t === "pan");
    canvas.classList.toggle("pan", t === "pan");
  }
  $("#tSelect").addEventListener("click", () => setTool("select"));
  $("#tPan").addEventListener("click", () => setTool("pan"));
  $("#tFit").addEventListener("click", () => fitTo(state.shown.size ? [...state.shown] : ["placeholder"]));
  $("#tFocus").addEventListener("click", (e) => {
    app.classList.toggle("focusmode");
    e.currentTarget.classList.toggle("on", app.classList.contains("focusmode"));
    setTimeout(() => fitTo(state.shown.size ? [...state.shown] : ["placeholder"]), 340);
  });
  $("#zIn").addEventListener("click", () => zoomBy(1.15));
  $("#zOut").addEventListener("click", () => zoomBy(1 / 1.15));
  $("#restart").addEventListener("click", reset);
  $("#sheetRestart").addEventListener("click", reset);

  function reset() {
    Object.assign(state, {
      step: 0, placed: false, analyzing: false, contextSet: false, editingField: null,
      form: { ...DEFAULTS, constraints: [...DEFAULTS.constraints] },
      range: "Explore",
      shown: new Set(), pending: new Set(), selected: null, spent: new Set(),
      done: false, busy: false, rejected: new Map(), rejectingId: null
    });
    sheet.classList.remove("on");
    status.classList.remove("busy");
    exportBtn.textContent = "Export selected path";
    exportBtn.hidden = true;
    render();
    fitTo(["placeholder"]);
  }

  addEventListener("resize", () => fitTo(state.shown.size ? [...state.shown] : ["placeholder"], false));

  render();
  fitTo(["placeholder"], false);
})();
</script>
